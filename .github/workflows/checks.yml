name: Firmware checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libsodium-dev libsecp256k1-dev nlohmann-json3-dev
      - run: cmake -S . -B build -DWFW_HARDWARE=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
